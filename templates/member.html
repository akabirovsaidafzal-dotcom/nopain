{% extends "base.html" %}

{% block content %}

<section class="member-page-premium">
  <div class="member-bg-word">PROFIL</div>
  <div class="member-glow"></div>

  <div class="member-visual-card">
    <div class="member-photo-premium">
      <img src="{{ url_for('static', filename=person.photo) }}" alt="{{ person.name }}">
    </div>

    <div class="member-mini-stats">
      <div>
        <span>ROL</span>
        <p>{{ person.role }}</p>
      </div>

      <div>
        <span>FOKUS</span>
        <p>Premium vizual</p>
      </div>
    </div>
  </div>

  <div class="member-info-premium">
    <p class="tag">Jamoa profili</p>
    <h1>{{ person.name }}</h1>
    <h2>{{ person.role }}</h2>
    <p>{{ person.bio }}</p>

    <div class="member-skill-grid">
      {% for skill in person.skills %}
        <div class="skill-card">
          <span>0{{ loop.index }}</span>
          <p>{{ skill }}</p>
        </div>
      {% endfor %}
    </div>

    <div class="member-actions">
      <a href="/team" class="secondary-btn">Jamoaga qaytish</a>
      <a href="/contact" class="cta">Loyihani boshlash</a>
    </div>
  </div>
</section>

{% endblock %}
